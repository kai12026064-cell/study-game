<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">ゲーム感覚で勉強しよう</p>
          <h1>Study Quest</h1>
          <p class="hero-copy">
            3つの科目から選んで、クイズに挑戦しながら知識を積み上げる学習ゲームです。
          </p>
        </div>
        <div class="hero-badge">今日の目標: 3問クリア</div>
      </header>

      <main class="panel">
        <section class="stats">
          <div class="stat-card">
            <span>XP</span>
            <strong id="xpValue">0</strong>
          </div>
          <div class="stat-card">
            <span>連続正解</span>
            <strong id="streakValue">0</strong>
          </div>
          <div class="stat-card">
            <span>正解数</span>
            <strong id="scoreValue">0</strong>
          </div>
        </section>

        <section class="subject-section">
          <h2>科目を選ぶ</h2>
          <div class="subject-buttons" id="subjectButtons">
            <button class="subject-btn active" data-subject="math">数学</button>
            <button class="subject-btn" data-subject="english">英語</button>
            <button class="subject-btn" data-subject="science">理科</button>
          </div>
        </section>

        <section id="stageCard" class="stage-card">
          <div class="stage-top">
            <div>
              <p class="eyebrow">RPGステージ</p>
              <h3 id="stageTitle">第1ステージ: 数学の森</h3>
              <p id="stageDescription">問題を解いてモンスターにダメージを与えよう。</p>
            </div>
          </div>
          <div class="battle-field">
            <div class="character-card player-card">
              <div class="character-avatar">🧑‍🚀</div>
              <div class="character-info">
                <strong>勇者</strong>
                <div class="hp-bar"><div id="playerHpFill"></div></div>
                <span id="playerHpText">5/5</span>
              </div>
            </div>
            <div class="vs-mark">VS</div>
            <div class="character-card enemy-card">
              <div class="character-avatar" id="enemyEmoji">🧮</div>
              <div class="character-info">
                <strong>モンスター</strong>
                <div class="hp-bar enemy"><div id="enemyHpFill"></div></div>
                <span id="enemyHpText">5/5</span>
              </div>
            </div>
          </div>
        </section>

        <section id="startCard" class="card">
          <h3 id="subjectLabel">数学のクエスト</h3>
          <p id="subjectDescription">公式を使って、短時間で解ける問題に挑戦します。</p>
          <button id="startButton" class="primary-btn">スタート</button>
        </section>

        <section id="gameCard" class="card hidden">
          <div class="question-head">
            <span class="question-count" id="questionCount">1 / 5</span>
            <div class="progress-bar">
              <div id="progressFill"></div>
            </div>
          </div>
          <h3 id="questionText"></h3>
          <div id="options" class="options"></div>
          <button id="hintButton" class="secondary-btn">ヒントを見る</button>
          <p id="hintText" class="hint hidden"></p>
          <p id="feedback" class="feedback"></p>
          <button id="nextButton" class="primary-btn hidden">次へ進む</button>
        </section>

        <section id="resultCard" class="card hidden">
          <h3>お疲れさま！</h3>
          <p id="resultMessage"></p>
          <div class="result-summary">
            <p>正解数: <strong id="finalScore">0</strong></p>
            <p>獲得XP: <strong id="finalXp">0</strong></p>
          </div>
          <button id="restartButton" class="primary-btn">もう一度挑戦</button>
        </section>
      </main>
    </div>

    <script src="questionUtils.js"></script>
    <script src="script.js"></script>
  </body>
</html>
